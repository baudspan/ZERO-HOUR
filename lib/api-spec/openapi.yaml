openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ZERO HOUR participant, scoring, leaderboard, and organizer API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: competition
    description: Public event status and leaderboard
  - name: participant
    description: Team access, progress, execution, and submissions
  - name: organizer
    description: Protected organizer operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /competition:
    get:
      operationId: getCompetition
      tags: [competition]
      summary: Get public competition status and questions
      responses:
        "200":
          description: Competition status and public challenge content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Competition"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [competition]
      summary: Get ranked live standings
      responses:
        "200":
          description: Ranked team standings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
  /participant/session:
    post:
      operationId: createParticipantSession
      tags: [participant]
      summary: Sign in using a registered team ID and access code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParticipantCredentials"
      responses:
        "200":
          description: Team session established
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDashboard"
        "401":
          description: Invalid team ID or access code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /participant/session/logout:
    post:
      operationId: deleteParticipantSession
      tags: [participant]
      summary: End the current team session
      responses:
        "204":
          description: Session ended
  /participant/me:
    get:
      operationId: getParticipantDashboard
      tags: [participant]
      summary: Get the current team's progress and unlocked challenge
      responses:
        "200":
          description: Team progress and current challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDashboard"
        "401":
          description: Team session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /participant/draft:
    put:
      operationId: saveParticipantDraft
      tags: [participant]
      summary: Persist the current team's editor draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "200":
          description: Draft saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftResult"
  /participant/questions/{questionId}/run:
    post:
      operationId: runParticipantCode
      tags: [participant]
      summary: Run code against a supplied input without changing score or unlocking
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRunInput"
      responses:
        "200":
          description: Sandbox execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResult"
  /participant/questions/{questionId}/submit:
    post:
      operationId: submitParticipantCode
      tags: [participant]
      summary: Score code against hidden tests and unlock the next challenge on success
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeSubmissionInput"
      responses:
        "200":
          description: Submission outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
  /organizer/summary:
    get:
      operationId: getOrganizerSummary
      tags: [organizer]
      summary: Get organizer event and score summary
      responses:
        "200":
          description: Organizer summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizerSummary"
        "401":
          description: Organizer sign-in required
  /organizer/participants:
    get:
      operationId: getOrganizerParticipants
      tags: [organizer]
      summary: Search and filter participant detail
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, in_progress, complete, expired, not_started]
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [score, team, completion]
      responses:
        "200":
          description: Matching team details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizerParticipant"
        "401":
          description: Organizer sign-in required
  /organizer/import:
    post:
      operationId: importOrganizerTeams
      tags: [organizer]
      summary: Import registered teams from CSV and issue access codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamImportInput"
      responses:
        "200":
          description: Imported teams and one-time access codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamImportResult"
        "400":
          description: CSV format or row validation failed
  /organizer/export:
    get:
      operationId: exportOrganizerCsv
      tags: [organizer]
      summary: Export team results as CSV
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "401":
          description: Organizer sign-in required
  /organizer/event:
    put:
      operationId: setOrganizerEvent
      tags: [organizer]
      summary: Set the official challenge start time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventScheduleInput"
      responses:
        "200":
          description: Updated event schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSchedule"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    ExampleCase:
      type: object
      required: [input, output]
      properties:
        input:
          type: string
        output:
          type: string
    Challenge:
      type: object
      required: [id, title, difficulty, concepts, statement, instructions, starterCode, examples]
      properties:
        id:
          type: integer
        title:
          type: string
        difficulty:
          type: string
          enum: [Easy, Medium, Hard]
        concepts:
          type: array
          items:
            type: string
        statement:
          type: string
        instructions:
          type: string
        starterCode:
          type: string
        examples:
          type: array
          items:
            $ref: "#/components/schemas/ExampleCase"
    Competition:
      type: object
      required: [title, durationSeconds, serverNow, questions, startAt, status]
      properties:
        title:
          type: string
        durationSeconds:
          type: integer
        serverNow:
          type: string
          format: date-time
        startAt:
          type: ["string", "null"]
          format: date-time
        deadline:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [not_scheduled, scheduled, running, ended]
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Challenge"
    ParticipantCredentials:
      type: object
      required: [teamId, accessCode]
      properties:
        teamId:
          type: string
          minLength: 1
          maxLength: 80
        accessCode:
          type: string
          minLength: 1
          maxLength: 128
    QuestionProgress:
      type: object
      required: [questionId, status, score, attempts]
      properties:
        questionId:
          type: integer
        status:
          type: string
          enum: [locked, unlocked, solved]
        score:
          type: integer
        attempts:
          type: integer
        unlockedAt:
          type: ["string", "null"]
          format: date-time
        solvedAt:
          type: ["string", "null"]
          format: date-time
        attemptLog:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionAttempt"
    SubmissionAttempt:
      type: object
      required: [submittedAt, passed, scoreAwarded]
      properties:
        submittedAt:
          type: string
          format: date-time
        passed:
          type: boolean
        scoreAwarded:
          type: integer
    ParticipantDashboard:
      type: object
      required: [teamId, teamName, serverNow, status, activeQuestionId, progress, totalScore, solvedCount]
      properties:
        teamId:
          type: string
        teamName:
          type: string
        serverNow:
          type: string
          format: date-time
        startAt:
          type: ["string", "null"]
          format: date-time
        deadline:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [not_scheduled, scheduled, running, ended, complete]
        activeQuestionId:
          type: ["integer", "null"]
        question:
          oneOf:
            - $ref: "#/components/schemas/Challenge"
            - type: "null"
        draft:
          type: ["string", "null"]
        progress:
          type: array
          items:
            $ref: "#/components/schemas/QuestionProgress"
        totalScore:
          type: integer
        solvedCount:
          type: integer
        completedAt:
          type: ["string", "null"]
          format: date-time
    DraftInput:
      type: object
      required: [questionId, code]
      properties:
        questionId:
          type: integer
        code:
          type: string
          maxLength: 30000
    DraftResult:
      type: object
      required: [saved]
      properties:
        saved:
          type: boolean
    CodeRunInput:
      type: object
      required: [code, input]
      properties:
        code:
          type: string
          maxLength: 30000
        input:
          type: string
          maxLength: 10000
    CodeRunResult:
      type: object
      required: [status, stdout, stderr, executionMs]
      properties:
        status:
          type: string
          enum: [success, error, timeout, unavailable]
        stdout:
          type: string
        stderr:
          type: string
        executionMs:
          type: integer
    CodeSubmissionInput:
      type: object
      required: [code, submissionId]
      properties:
        code:
          type: string
          maxLength: 30000
        submissionId:
          type: string
          minLength: 8
          maxLength: 80
    SubmissionResult:
      type: object
      required: [passed, scoreAdded, totalScore, solvedCount, attempts, nextQuestionId]
      properties:
        passed:
          type: boolean
        scoreAdded:
          type: integer
        totalScore:
          type: integer
        solvedCount:
          type: integer
        attempts:
          type: integer
        message:
          type: string
        nextQuestionId:
          type: ["integer", "null"]
        completedAt:
          type: ["string", "null"]
          format: date-time
    LeaderboardEntry:
      type: object
      required: [rank, teamId, teamName, score, solvedCount, status]
      properties:
        rank:
          type: integer
        teamId:
          type: string
        teamName:
          type: string
        score:
          type: integer
        solvedCount:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, complete, expired]
        completedAt:
          type: ["string", "null"]
          format: date-time
    OrganizerSummary:
      type: object
      required: [teamCount, startedCount, completedCount, expiredCount, averageScore, runnerConfigured, event]
      properties:
        teamCount:
          type: integer
        startedCount:
          type: integer
        completedCount:
          type: integer
        expiredCount:
          type: integer
        averageScore:
          type: number
        runnerConfigured:
          type: boolean
        event:
          $ref: "#/components/schemas/EventSchedule"
    OrganizerParticipant:
      type: object
      required: [teamId, teamName, participantNames, score, solvedCount, status, attempts, questions]
      properties:
        teamId:
          type: string
        teamName:
          type: string
        participantNames:
          type: array
          items:
            type: string
        score:
          type: integer
        solvedCount:
          type: integer
        status:
          type: string
          enum: [not_started, in_progress, complete, expired]
        attempts:
          type: integer
        completedAt:
          type: ["string", "null"]
          format: date-time
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionProgress"
    TeamImportInput:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          maxLength: 200000
    IssuedTeamCode:
      type: object
      required: [teamId, teamName, accessCode]
      properties:
        teamId:
          type: string
        teamName:
          type: string
        accessCode:
          type: string
    TeamImportResult:
      type: object
      required: [imported, teams]
      properties:
        imported:
          type: integer
        teams:
          type: array
          items:
            $ref: "#/components/schemas/IssuedTeamCode"
    EventScheduleInput:
      type: object
      required: [startAt]
      properties:
        startAt:
          type: string
          format: date-time
    EventSchedule:
      type: object
      required: [startAt, deadline, durationSeconds, status]
      properties:
        startAt:
          type: ["string", "null"]
          format: date-time
        deadline:
          type: ["string", "null"]
          format: date-time
        durationSeconds:
          type: integer
        status:
          type: string
          enum: [not_scheduled, scheduled, running, ended]

